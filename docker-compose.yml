version: '3.8'

services:
  # High-Scale PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: clubops-postgres
    restart: always
    environment:
      POSTGRES_USER: clubops
      POSTGRES_PASSWORD: clubops_secure_password_2026
      POSTGRES_DB: clubops_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clubops -d clubops_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # In-Memory Cache, Pub/Sub & Queue Broker
  redis:
    image: redis:7-alpine
    container_name: clubops-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Scalable ClubOps Backend API Cluster
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clubops-api
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "postgresql://clubops:clubops_secure_password_2026@postgres:5432/clubops_db?schema=public&connection_limit=25"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "clubops-super-secret-jwt-key-2026"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Frontend Web Client
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: clubops-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
